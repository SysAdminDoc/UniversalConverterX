name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sidecar-contract:
    name: Sidecar NDJSON contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sidecar contract conformance
        # Pure stdlib (ast, pathlib, sys) — no pip install needed.
        # Exits non-zero on any violation; that fails the job + gates merge.
        run: python tests/sidecar_contract/check_contract.py

  uia-contract:
    name: WinUI 3 AutomationId contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify AutomationId presence on new interactive controls
        # Stdlib only. Compares current XAML scan against
        # tests/uia_contract/baseline.txt — only NEW controls without
        # AutomationId fail the build. Run with --write-baseline locally
        # to rebaseline after a planned cleanup pass.
        run: python tests/uia_contract/check_uia.py

  build:
    runs-on: windows-latest
    needs: [sidecar-contract, uia-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test src/UniversalConverterX.sln -c Release --nologo
      - name: Publish Console
        run: dotnet publish src/UniversalConverterX.Console/UniversalConverterX.Console.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/console
      - name: Publish UI
        run: dotnet publish src/UniversalConverterX.UI/UniversalConverterX.UI.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/ui
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConverterX-win-x64
          path: publish/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload ${{ github.ref_name }} publish/console/UniversalConverterX.Console.exe --clobber
          gh release upload ${{ github.ref_name }} publish/ui/UniversalConverterX.UI.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
